name: Build and Tests

on:
  pull_request:
  push:
    branches: [main, dev]
    paths-ignore: [.gitignore, LICENSE, README.md]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ join(matrix.*, ', ') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # Only needed for private repos.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plat: android, os: ubuntu-latest, arch: arm64-v8a, toolchain: ndk, mode: release }

          - { plat: linux, os: ubuntu-latest, arch: x86_64, toolchain: gcc, mode: debug }
          - { plat: linux, os: ubuntu-latest, arch: x86_64, toolchain: gcc, mode: release }
          - { plat: linux, os: ubuntu-latest, arch: x86_64, toolchain: clang, mode: release }

          - { plat: macosx, os: macos-latest, arch: arm64, toolchain: xcode, mode: release }

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1.2.5
        with:
          xmake-version: branch@master
          actions-cache-folder: .xmake-cache
          actions-cache-key: ${{ matrix.plat }}_${{ matrix.arch }}_${{ matrix.toolchain }}_${{ matrix.mode }}

      - name: Build and test
        run: xmake l ./scripts/test.lua -vD -p ${{ matrix.plat }} -a ${{ matrix.arch }} --toolchain=${{ matrix.toolchain }} -m ${{ matrix.mode }}
