name: Build and Tests

on:
  pull_request:
  push:
    paths-ignore: [.gitignore, LICENSE, README.md]

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    name: ${{ matrix.plat }} (${{ matrix.os }}, ${{ matrix.arch }}, ${{ matrix.toolchain }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plat: android, os: ubuntu-latest, arch: arm64-v8a, toolchain: ndk, mode: release }

          - { plat: linux, os: ubuntu-latest, arch: x86_64, toolchain: gcc, mode: debug }
          - { plat: linux, os: ubuntu-latest, arch: x86_64, toolchain: gcc, mode: release }
          - { plat: linux, os: ubuntu-latest, arch: x86_64, toolchain: clang, mode: release }

          - { plat: macosx, os: macos-latest, arch: arm64, toolchain: xcode, mode: release }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@master
          actions-cache-folder: .xmake-cache
          actions-cache-key: ${{ matrix.plat }}_${{ matrix.arch }}_${{ matrix.toolchain }}_${{ matrix.mode }}

      - name: Build and test
        run: xmake l ./scripts/test.lua -vD -p ${{ matrix.plat }} -a ${{ matrix.arch }} --toolchain=${{ matrix.toolchain }} -m ${{ matrix.mode }}
